<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#mlGradient)" opacity="0.1"/>
  
  <!-- Neural Network -->
  <circle cx="80" cy="80" r="15" fill="#7c3aed"/>
  <circle cx="128" cy="60" r="15" fill="#06b6d4"/>
  <circle cx="176" cy="80" r="15" fill="#f59e0b"/>
  <circle cx="100" cy="128" r="15" fill="#10b981"/>
  <circle cx="156" cy="128" r="15" fill="#ef4444"/>
  <circle cx="80" cy="176" r="15" fill="#8b5cf6"/>
  <circle cx="128" cy="196" r="15" fill="#22d3ee"/>
  <circle cx="176" cy="176" r="15" fill="#f97316"/>
  
  <!-- Connections -->
  <g stroke="#7c3aed" stroke-width="3" opacity="0.6">
    <line x1="80" y1="80" x2="128" y2="60"/>
    <line x1="128" y1="60" x2="176" y2="80"/>
    <line x1="80" y1="80" x2="100" y2="128"/>
    <line x1="176" y1="80" x2="156" y2="128"/>
    <line x1="100" y1="128" x2="156" y2="128"/>
    <line x1="100" y1="128" x2="80" y2="176"/>
    <line x1="156" y1="128" x2="176" y2="176"/>
    <line x1="80" y1="176" x2="128" y2="196"/>
    <line x1="176" y1="176" x2="128" y2="196"/>
  </g>
  
  <!-- Central AI Symbol -->
  <circle cx="128" cy="128" r="8" fill="#ffffff"/>
  <text x="128" y="135" text-anchor="middle" fill="#7c3aed" font-family="Arial" font-size="12" font-weight="bold">AI</text>
