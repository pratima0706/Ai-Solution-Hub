<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0,20 L20,20 L20,0 M20,20 L40,20 M20,0 L20,40 M20,40 L0,40 L0,20" 
            fill="none" stroke="rgba(99, 102, 241, 0.1)" stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="rgba(99, 102, 241, 0.2)"/>
    </pattern>
    <pattern id="hexagon" width="60" height="60" patternUnits="userSpaceOnUse">
      <polygon points="30,5 50,20 50,40 30,55 10,40 10,20" 
               fill="none" stroke="rgba(139, 92, 246, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#circuit)"/>
  <rect width="200" height="200" fill="url(#hexagon)"/>
</svg>
