<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c2d12;stop-opacity:1" />
    </linearGradient>
    <pattern id="circuitPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#60a5fa" opacity="0.2"/>
      <rect x="40" y="40" width="2" height="2" fill="#a78bfa" opacity="0.2"/>
      <path d="M 0 40 L 40 40 L 40 0" stroke="#22d3ee" stroke-width="1" opacity="0.1" fill="none"/>
      <path d="M 40 80 L 80 80 L 80 40" stroke="#22d3ee" stroke-width="1" opacity="0.1" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGradient2)"/>
  <rect width="1920" height="1080" fill="url(#circuitPattern)"/>
  
  <!-- Neural Network Nodes -->
  <circle cx="300" cy="150" r="40" fill="#60a5fa" opacity="0.2"/>
  <circle cx="600" cy="250" r="30" fill="#a78bfa" opacity="0.2"/>
  <circle cx="900" cy="180" r="35" fill="#22d3ee" opacity="0.2"/>
  <circle cx="1200" cy="300" r="25" fill="#f59e0b" opacity="0.2"/>
  <circle cx="1500" cy="200" r="45" fill="#10b981" opacity="0.2"/>
  <circle cx="1800" cy="350" r="30" fill="#ef4444" opacity="0.2"/>
  
  <!-- Connection Lines -->
  <g stroke="#60a5fa" stroke-width="2" opacity="0.1">
    <line x1="300" y1="150" x2="600" y2="250"/>
    <line x1="600" y1="250" x2="900" y2="180"/>
    <line x1="900" y1="180" x2="1200" y2="300"/>
    <line x1="1200" y1="300" x2="1500" y2="200"/>
    <line x1="1500" y1="200" x2="1800" y2="350"/>
  </g>
</svg>
