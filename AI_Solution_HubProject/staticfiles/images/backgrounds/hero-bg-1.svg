<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    <pattern id="techPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#60a5fa" opacity="0.1"/>
      <circle cx="80" cy="80" r="2" fill="#a78bfa" opacity="0.1"/>
      <path d="M 0 50 L 50 50 L 50 0" stroke="#22d3ee" stroke-width="1" opacity="0.05" fill="none"/>
      <path d="M 50 100 L 100 100 L 100 50" stroke="#22d3ee" stroke-width="1" opacity="0.05" fill="none"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGradient)"/>
  <rect width="1920" height="1080" fill="url(#techPattern)"/>
  
  <!-- Floating AI Elements -->
  <circle cx="200" cy="200" r="80" fill="#60a5fa" opacity="0.1"/>
  <circle cx="1720" cy="300" r="120" fill="#a78bfa" opacity="0.1"/>
  <circle cx="400" cy="800" r="100" fill="#22d3ee" opacity="0.1"/>
  <circle cx="1500" cy="900" r="60" fill="#f59e0b" opacity="0.1"/>
  
  <!-- Tech Grid Lines -->
  <g stroke="#60a5fa" stroke-width="1" opacity="0.05">
    <line x1="0" y1="0" x2="1920" y2="1080"/>
    <line x1="1920" y1="0" x2="0" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>
</svg>
