<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Solution Hub{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="{% url 'ai_solution_app:home' %}" class="text-2xl font-bold text-blue-600">
                    <i class="fas fa-brain mr-2"></i>AI Solution Hub
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="{% url 'ai_solution_app:home' %}" class="text-gray-700 hover:text-blue-600">Home</a>
                    <a href="{% url 'ai_solution_app:services' %}" class="text-gray-700 hover:text-blue-600">Services</a>
                    <a href="{% url 'ai_solution_app:past_solutions' %}" class="text-gray-700 hover:text-blue-600">Past Solutions</a>
                    <a href="{% url 'ai_solution_app:events_gallery' %}" class="text-gray-700 hover:text-blue-600">Events & Gallery</a>
                    <a href="{% url 'ai_solution_app:customer_feedback' %}" class="text-gray-700 hover:text-blue-600">Customer Feedback</a>
                    <a href="{% url 'ai_solution_app:articles_blog' %}" class="text-gray-700 hover:text-blue-600">Articles</a>
                    <a href="{% url 'ai_solution_app:contact_us' %}" class="text-gray-700 hover:text-blue-600">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-16">
        {% if messages %}
            <div class="max-w-7xl mx-auto px-4 py-2">
                {% for message in messages %}
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-2">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2024 AI Solution Hub. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
