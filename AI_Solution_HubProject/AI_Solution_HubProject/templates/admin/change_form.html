{% extends "admin/base_standalone.html" %}
{% load static %}

{% block page_title %}{{ title }}{% endblock %}

{% block extrastyle %}
<style>
/* Override Django admin styles */
#content {
  margin: 0 !important;
  padding: 0 !important;
}

#content-main {
  padding: 0 !important;
}

.module {
  background: white !important;
  border: none !important;
  border-radius: 12px !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
  margin-bottom: 2rem !important;
  overflow: hidden !important;
}

.module h2 {
  background: linear-gradient(135deg, #8B5CF6, #7C3AED) !important;
  color: white !important;
  padding: 1.5rem 2rem !important;
  margin: 0 !important;
  font-size: 1.5rem !important;
  font-weight: 600 !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
}

.module h2 a {
  background: rgba(255,255,255,0.2) !important;
  color: white !important;
  border: 1px solid rgba(255,255,255,0.3) !important;
  padding: 0.75rem 1.5rem !important;
  border-radius: 8px !important;
  text-decoration: none !important;
  font-weight: 600 !important;
  font-size: 0.9rem !important;
  transition: all 0.3s ease !important;
}

.module h2 a:hover {
  background: rgba(255,255,255,0.3) !important;
  color: white !important;
}

.module h3 {
  background: #f8fafc !important;
  color: #374151 !important;
  padding: 1rem 2rem !important;
  margin: 0 !important;
  border-bottom: 1px solid #e2e8f0 !important;
  font-size: 1rem !important;
  font-weight: 600 !important;
}

.form-row {
  padding: 1rem 2rem !important;
  border-bottom: 1px solid #f3f4f6 !important;
}

.form-row:last-child {
  border-bottom: none !important;
}

.form-row label {
  font-weight: 600 !important;
  color: #374151 !important;
  margin-bottom: 0.5rem !important;
  display: block !important;
  font-size: 0.9rem !important;
}

.form-row input, .form-row select, .form-row textarea {
  width: 100% !important;
  padding: 0.75rem !important;
  border: 1px solid #d1d5db !important;
  border-radius: 8px !important;
  font-size: 0.9rem !important;
  transition: border-color 0.3s ease !important;
  background: white !important;
}

.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  outline: none !important;
  border-color: #8B5CF6 !important;
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1) !important;
}

.form-row textarea {
  min-height: 120px !important;
  resize: vertical !important;
}

.form-row .help {
  font-size: 0.8rem !important;
  color: #6b7280 !important;
  margin-top: 0.25rem !important;
}

.form-row .errorlist {
  color: #dc2626 !important;
  font-size: 0.8rem !important;
  margin-top: 0.25rem !important;
  list-style: none !important;
  padding: 0 !important;
}

.submit-row {
  background: #f8fafc !important;
  padding: 1.5rem 2rem !important;
  border-top: 1px solid #e2e8f0 !important;
  border-radius: 0 0 12px 12px !important;
  display: flex !important;
  gap: 1rem !important;
  justify-content: flex-end !important;
}

.submit-row input, .submit-row a {
  padding: 0.75rem 1.5rem !important;
  border-radius: 8px !important;
  font-weight: 600 !important;
  text-decoration: none !important;
  border: none !important;
  cursor: pointer !important;
  font-size: 0.9rem !important;
  transition: all 0.3s ease !important;
}

.submit-row input[type="submit"] {
  background: #8B5CF6 !important;
  color: white !important;
}

.submit-row input[type="submit"]:hover {
  background: #7C3AED !important;
  transform: translateY(-1px) !important;
}

.submit-row a.default {
  background: #6b7280 !important;
  color: white !important;
}

.submit-row a.default:hover {
  background: #4b5563 !important;
}

.submit-row a.deletelink {
  background: #dc2626 !important;
  color: white !important;
}

.submit-row a.deletelink:hover {
  background: #b91c1c !important;
}

/* Hide default Django admin elements */
#header, #user-tools, #nav-global, #nav-breadcrumbs, #nav-sidebar {
  display: none !important;
}

body {
  background: #f8fafc !important;
}

/* Inline forms */
.inline-group {
  background: white !important;
  border: none !important;
  border-radius: 12px !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
  margin-bottom: 2rem !important;
  overflow: hidden !important;
}

.inline-group h2 {
  background: #f8fafc !important;
  color: #374151 !important;
  padding: 1rem 2rem !important;
  margin: 0 !important;
  border-bottom: 1px solid #e2e8f0 !important;
  font-size: 1.1rem !important;
  font-weight: 600 !important;
}

.inline-group .form-row {
  padding: 1rem 2rem !important;
}

.add-row {
  background: #10b981 !important;
  color: white !important;
  border: none !important;
  padding: 0.5rem 1rem !important;
  border-radius: 6px !important;
  font-size: 0.8rem !important;
  cursor: pointer !important;
  margin: 1rem 2rem !important;
}

.add-row:hover {
  background: #059669 !important;
}
</style>
{% endblock %}

{% block content %}
<!-- Use Django's default admin content but with our styling -->
{% block content_main %}
{{ block.super }}
{% endblock %}
{% endblock %}
