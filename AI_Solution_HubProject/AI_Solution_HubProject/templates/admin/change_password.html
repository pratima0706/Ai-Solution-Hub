{% extends "admin/base_standalone.html" %}
{% load static %}

{% block page_title %}Change Password{% endblock %}

{% block extrastyle %}
<style>
/* Change Password Page Specific Styles - Scoped to avoid conflicts with base template */
.password-container {
  max-width: 500px;
  width: 100%;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  overflow: hidden;
}

.password-container .password-header {
  background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
  color: white;
  padding: 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.password-container .password-header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: float 20s infinite linear;
  pointer-events: none;
}

@keyframes float {
  0% { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}

.password-container .password-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  position: relative;
  z-index: 2;
}

.password-container .password-subtitle {
  opacity: 0.9;
  font-size: 1rem;
  position: relative;
  z-index: 2;
}

.password-container .password-content {
  padding: 2rem;
}

.password-container .form-group {
  margin-bottom: 1.5rem;
}

.password-container .form-label {
  font-weight: 600;
  color: #374151;
  margin-bottom: 0.5rem;
  display: block;
  font-size: 0.95rem;
}

.password-container .form-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: white;
}

.password-container .form-input:focus {
  outline: none;
  border-color: #ef4444;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
}

.password-container .password-strength {
  margin-top: 0.75rem;
  padding: 0.75rem;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

.password-container .strength-bar {
  height: 4px;
  background: #e5e7eb;
  border-radius: 2px;
  overflow: hidden;
  transition: all 0.3s ease;
  margin-bottom: 0.5rem;
}

.password-container .strength-text {
  font-size: 0.875rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.password-container .password-criteria {
  font-size: 0.8rem;
  color: #64748b;
  line-height: 1.4;
}

.password-container .password-criteria .criteria-item {
  display: flex;
  align-items: center;
  margin-bottom: 0.25rem;
}

.password-container .password-criteria .criteria-item.valid {
  color: #059669;
}

.password-container .password-criteria .criteria-item.invalid {
  color: #dc2626;
}

.password-container .password-match-error {
  color: #dc2626;
  font-size: 0.875rem;
  margin-top: 0.5rem;
  font-weight: 500;
}

.password-container .strength-weak { background: #ef4444; }
.password-container .strength-fair { background: #f59e0b; }
.password-container .strength-good { background: #10b981; }
.password-container .strength-strong { background: #059669; }

.password-container .form-actions {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 2rem;
  flex-wrap: wrap;
}

/* Change Password Action Buttons - Scoped to avoid navigation conflicts */
.password-container .password-btn {
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.95rem;
}

.password-container .password-btn-primary {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
}

.password-container .password-btn-primary:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

.password-container .password-btn-secondary {
  background: linear-gradient(135deg, #64748b, #475569);
  color: white;
}

.password-container .password-btn-secondary:hover {
  background: linear-gradient(135deg, #475569, #334155);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3);
}

.password-container .error-message {
  background: #fef2f2;
  color: #dc2626;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #dc2626;
  font-weight: 500;
}

.password-container .success-message {
  background: #f0fdf4;
  color: #16a34a;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #16a34a;
  font-weight: 500;
}

/* Responsive Design - Scoped to change password page only */
@media (max-width: 768px) {
  .password-container .password-content {
    padding: 1.5rem;
  }
}

@media (max-width: 480px) {
  .password-container .password-header {
    padding: 1.5rem 1rem;
  }
  
  .password-container .password-content {
    padding: 1rem;
  }
  
  .password-container .password-title {
    font-size: 1.5rem;
  }
}
</style>
{% endblock %}

{% block content %}
<div class="password-container">
  
  <!-- Password Header -->
  <div class="password-header">
    <h1 class="password-title">Change Password</h1>
    <p class="password-subtitle">Update your account password</p>
  </div>

  <!-- Password Content -->
  <div class="password-content">
    <form method="post" id="password-form">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="old_password" class="form-label">Current Password *</label>
        <input type="password" id="old_password" name="old_password" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label for="new_password1" class="form-label">New Password *</label>
        <input type="password" id="new_password1" name="new_password1" class="form-input" required>
        <div class="password-strength" id="password-strength" style="display: none;">
          <div class="strength-bar" id="strength-bar"></div>
          <div class="strength-text" id="strength-text"></div>
          <div class="password-criteria" id="password-criteria"></div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="new_password2" class="form-label">Confirm New Password *</label>
        <input type="password" id="new_password2" name="new_password2" class="form-input" required>
        <div class="password-match-error" id="password-match-error" style="display: none;">
          ❌ Passwords don't match
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="password-btn password-btn-primary">
          🔒 Change Password
        </button>
        
        <a href="/admin-dashboard/profile/" class="password-btn password-btn-secondary">
          ❌ Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<script>
// Password strength checker with criteria
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('password-form');
  const newPassword = document.querySelector('[name="new_password1"]');
  const confirmPassword = document.querySelector('[name="new_password2"]');
  const passwordStrength = document.getElementById('password-strength');
  const strengthBar = document.getElementById('strength-bar');
  const strengthText = document.getElementById('strength-text');
  const passwordCriteria = document.getElementById('password-criteria');
  const passwordMatchError = document.getElementById('password-match-error');
  
  // Password strength checker
  newPassword.addEventListener('input', function() {
    const password = this.value;
    
    if (password.length === 0) {
      passwordStrength.style.display = 'none';
      return;
    }
    
    passwordStrength.style.display = 'block';
    
    // Check password criteria
    const criteria = [
      { text: 'At least 8 characters', valid: password.length >= 8 },
      { text: 'Contains lowercase letter', valid: /[a-z]/.test(password) },
      { text: 'Contains uppercase letter', valid: /[A-Z]/.test(password) },
      { text: 'Contains number', valid: /[0-9]/.test(password) },
      { text: 'Contains special character', valid: /[^a-zA-Z0-9]/.test(password) }
    ];
    
    // Calculate strength
    const validCriteria = criteria.filter(c => c.valid).length;
    let strengthLabel = '';
    let strengthClass = '';
    
    switch (validCriteria) {
      case 0:
      case 1:
        strengthLabel = 'Very Weak';
        strengthClass = 'strength-weak';
        break;
      case 2:
        strengthLabel = 'Weak';
        strengthClass = 'strength-weak';
        break;
      case 3:
        strengthLabel = 'Fair';
        strengthClass = 'strength-fair';
        break;
      case 4:
        strengthLabel = 'Good';
        strengthClass = 'strength-good';
        break;
      case 5:
        strengthLabel = 'Strong';
        strengthClass = 'strength-strong';
        break;
    }
    
    // Update strength bar
    strengthBar.style.width = (validCriteria * 20) + '%';
    strengthBar.className = 'strength-bar ' + strengthClass;
    strengthText.textContent = 'Password strength: ' + strengthLabel;
    
    // Update criteria display
    passwordCriteria.innerHTML = criteria.map(c => 
      `<div class="criteria-item ${c.valid ? 'valid' : 'invalid'}">
        ${c.valid ? '✓' : '✗'} ${c.text}
      </div>`
    ).join('');
  });
  
  // Password confirmation validation
  function validatePasswordMatch() {
    if (confirmPassword.value.length === 0) {
      passwordMatchError.style.display = 'none';
      return;
    }
    
    if (confirmPassword.value !== newPassword.value) {
      passwordMatchError.style.display = 'block';
      confirmPassword.style.borderColor = '#ef4444';
      confirmPassword.style.backgroundColor = '#fef2f2';
    } else {
      passwordMatchError.style.display = 'none';
      confirmPassword.style.borderColor = '#16a34a';
      confirmPassword.style.backgroundColor = '#f0fdf4';
    }
  }
  
  confirmPassword.addEventListener('input', validatePasswordMatch);
  newPassword.addEventListener('input', validatePasswordMatch);
  
  // Form submission
  form.addEventListener('submit', function(e) {
    const requiredFields = ['old_password', 'new_password1', 'new_password2'];
    let isValid = true;
    
    requiredFields.forEach(fieldName => {
      const field = document.querySelector(`[name="${fieldName}"]`);
      if (!field.value.trim()) {
        field.style.borderColor = '#ef4444';
        field.style.backgroundColor = '#fef2f2';
        isValid = false;
      }
    });
    
    if (newPassword.value !== confirmPassword.value) {
      passwordMatchError.style.display = 'block';
      confirmPassword.style.borderColor = '#ef4444';
      confirmPassword.style.backgroundColor = '#fef2f2';
      isValid = false;
    }
    
    if (!isValid) {
      e.preventDefault();
      showMessage('Please fill in all fields correctly and ensure passwords match', 'error');
    }
  });
  
  function showMessage(message, type) {
    // Remove existing messages
    const existingMessages = document.querySelectorAll('.error-message, .success-message');
    existingMessages.forEach(msg => msg.remove());
    
    // Create new message
    const messageDiv = document.createElement('div');
    messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
    messageDiv.textContent = message;
    
    // Insert before form
    form.parentNode.insertBefore(messageDiv, form);
    
    // Auto remove after 5 seconds
    setTimeout(() => {
      if (messageDiv.parentNode) {
        messageDiv.style.opacity = '0';
        setTimeout(() => {
          if (messageDiv.parentNode) {
            messageDiv.remove();
          }
        }, 300);
      }
    }, 5000);
  }
});
</script>
{% endblock %}
