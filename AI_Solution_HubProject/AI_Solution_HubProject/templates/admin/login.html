<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Solution Hub - Admin Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
        body {
            margin:0; 
            min-height:100vh; 
            display:flex; 
            align-items:center; 
            justify-content:center; 
            background:url('/static/images/backgrounds/AiInsights.jpeg') center/cover no-repeat; 
            position:relative; 
        }

        .overlay {
            position:fixed; 
            inset:0; 
            background:rgba(0,0,0,.55); 
        }

        .wrap { 
            position:relative; 
            width:100%; 
            max-width:980px; 
            padding:24px; 
            display:flex; 
            justify-content:flex-start; 
            z-index:1; 
        }

        .shell { 
            width:380px; 
            background:rgba(255,255,255,.12); 
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border:1px solid rgba(255,255,255,.25);
            border-radius:22px; 
            padding:12px; 
            box-shadow:0 30px 80px rgba(0,0,0,.45); 
        }


        .card { 
            background:rgba(255,255,255,.10); 
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border:1px solid rgba(255,255,255,.2);
            border-radius:16px; 
            padding:20px 20px 16px; 
            box-shadow:0 10px 30px rgba(0,0,0,.10); 
        }

        
        .pill { 
            display:inline-block; 
            padding:8px 14px; 
            border-radius:9999px; 
            background:rgba(255,255,255,.25); 
            color:#ffffff; 
            font-weight:800; 
            font-size:12px; 
        }


        .title {
            margin:14px 0 18px; 
            color:#ffffff; 
            font-weight:800; 
            font-size:18px; 
        }


        label { 
            display:block; 
            color:#e5e7eb; 
            font-size:12px; 
            font-weight:700; 
            margin-bottom:6px; 
        }

        .input-wrap{ 
            position:relative; 
        }

        .icon{ display:none; }


        .input{ width:100%; padding:11px 12px; border:1px solid rgba(229,231,235,.65); background:rgba(255,255,255,.12); color:#ffffff; border-radius:12px; font-size:14px; outline:none; transition:box-shadow .2s, border-color .2s; }
        .input::placeholder{ color:#d1d5db; }

        .input:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.18); }

        .btn{ width:100%; padding:12px 16px; border:0; border-radius:12px; background:#2563eb; color:#fff; font-weight:800; letter-spacing:.3px; box-shadow:0 12px 26px rgba(37,99,235,.35); cursor:pointer; transition:transform .15s, background .2s; }

        .btn:hover{ background:#1d4ed8; transform:translateY(-1px);} .btn:active{ transform:translateY(0); }

        .links{ display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-top:12px; }

        .links a{ color:#93c5fd; text-decoration:none; } .links a:hover{ text-decoration:underline; }

        .note{ margin-top:14px; text-align:center; color:#cbd5e1; font-size:11px; }

        /* Popup message styles */
        .popup-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }
        
        .popup-message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards;
            opacity: 1;
            transform: translateX(0);
        }
        
        .popup-success {
            background: rgba(34, 197, 94, 0.9);
            color: white;
            border-color: rgba(34, 197, 94, 0.3);
        }
        
        .popup-error {
            background: rgba(239, 68, 68, 0.9);
  color: white;
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }
        
        /* message helpers to avoid template logic inside style attr */
        .msg{ padding:8px 10px; border-radius:10px; }

        .msg-error{ background:#fee2e2; color:#b91c1c; }

        .msg-success{ background:#dcfce7; color:#166534; }

        @media (max-width: 430px){ .shell{ width:100%; } .wrap{ padding:16px; } }
        
</style>
</head>
<body>
    <div class="overlay"></div>
    
    <!-- Popup Messages -->
    {% if messages %}
    <div class="popup-container">
        {% for message in messages %}
        <div class="popup-message {% if message.tags == 'error' %}popup-error{% else %}popup-success{% endif %}">
            {{ message }}
      </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <div class="wrap">
        <div class="shell">
            <div class="card">
                <div class="pill">Welcome to AI Solution Hub Portal</div>
                <div class="title">Log In</div>
                <form method="post">
                    {% csrf_token %}
                    <div style="margin-bottom:12px;">
                        <label for="username">Username or Email</label>
                        <div class="input-wrap">
                            <input id="username" name="username" type="text" autocomplete="username" required class="input" placeholder="Enter Username or Email">
      </div>
    </div>
                    <div style="margin-bottom:12px;">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input id="password" name="password" type="password" autocomplete="current-password" required class="input" placeholder="Enter Password">
  </div>
      </div>
                    <div class="links" style="margin:8px 0 16px;">
                        <label style="display:flex; align-items:center; gap:8px; color:#e5e7eb;">
                            <input type="checkbox" name="remember" style="width:14px;height:14px;">
                            Remember me
                        </label>
                        <a href="{% url 'password_reset' %}">Forgot password?</a>
      </div>
                    <button type="submit" class="btn">LOGIN</button>
                </form>
                
                <div class="note">Terms of use. Privacy policy.</div>
      </div>
  </div>
</div>

<script>
        // Auto-hide popup messages after 3 seconds
document.addEventListener('DOMContentLoaded', function() {
            const popups = document.querySelectorAll('.popup-message');
            popups.forEach(function(popup) {
                setTimeout(function() {
                    popup.style.animation = 'fadeOut 0.3s ease-in forwards';
                    setTimeout(function() {
                        popup.remove();
        }, 300);
                }, 3000);
    });
  });
  
        // Add loading state to login button
        document.querySelector('form').addEventListener('submit', function() {
            const btn = document.querySelector('.btn');
            btn.innerHTML = 'LOGGING IN...';
            btn.disabled = true;
});
</script>
</body>
</html>
